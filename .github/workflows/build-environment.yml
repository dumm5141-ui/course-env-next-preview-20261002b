# course-platform-managed:environment-v1
name: Build learner environment
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate environment contract
        run: |
          test -f environment/native.json
          test -f environment/publish.ts
      - name: Validate, build, publish and bind immutable environment
        run: node --experimental-strip-types environment/publish.ts
        env:
          PLATFORM_URL: "https://solly.riturajbasak.tech"
          PLATFORM_RESOURCE_IDS: "a75caf77c6e1635d100302881016cecc,a654cc29dcd5f96f57edfab5999ec816,d63450db78ddc5a977e372af12493a56,47515cef617ab6797a7f2b63d185c5e8"
